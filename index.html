<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBS De Eendragt - Dashboard</title>
    <style>
        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333333;
        }

        .main-header {
            background-color: #0d3c6c;
            color: #ffffff;
            padding: 15px 40px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .main-header h1 { margin: 0; font-size: 24px; font-weight: 600; }
        .main-header p { margin: 5px 0 0 0; font-size: 14px; opacity: 0.8; }

        .grid-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .menu-card {
            background: #ffffff;
            border: 3px solid;
            border-radius: 16px;
            padding: 25px 15px;
            text-align: center;
            text-decoration: none;
            color: #0d3c6c;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            transition: transform 0.15s, box-shadow 0.15s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 180px;
            box-sizing: border-box;
            cursor: pointer;
        }

        .menu-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
        }

        .menu-card img {
            max-height: 80px;
            max-width: 80%;
            object-fit: contain;
            margin-bottom: 15px;
        }

        /* Originele tegel-kleuren */
        .card-snappet { border-color: #ff7a00; }
        .card-rekenen { border-color: #00a3a3; }
        .card-automatiseringen { border-color: #333333; }
        .card-spelling { border-color: #4b5563; }
        .card-taal { border-color: #8b5cf6; }
        .card-faqta { border-color: #2563eb; }
        .card-topo { border-color: #059669; }
        .card-engels { border-color: #a855f7; }

        /* Modal / Keuzemenu Styling */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #ffffff;
            border-radius: 16px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            overflow: hidden;
            animation: fadeIn 0.2s ease-out;
        }

        .modal-header {
            background: #0d3c6c;
            color: white;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
        }

        .close-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .modal-body {
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .modal-btn {
            background: white;
            border: 3px solid #00a3a3;
            border-radius: 12px;
            padding: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #0d3c6c;
            text-decoration: none;
            text-align: center;
            transition: background 0.1s;
        }
        .modal-btn:hover {
            background: #e6fffa;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="main-header">
        <h1>CBS De Eendragt</h1>
        <p>Lef • Liefde • Leren • Leuk</p>
    </div>

    <div class="grid-container">
        <a href="https://snappet.org" target="_blank" class="menu-card card-snappet">
            <img src="SNAPPET.jpeg" alt="Snappet">
            <div>Snappet</div>
        </a>

        <div class="menu-card card-rekenen" onclick="openRekeningMenu()">
            <img src="Rekenen.jpeg" alt="Rekenen">
            <div>Rekenen</div>
        </div>

        <a href="tafels/" class="menu-card card-automatiseringen">
            <img src="Automatiseren.jpeg" alt="Automatiseren">
            <div>Automatiseren</div>
        </a>

        <a href="https://www.spellingoefenen.nl" target="_blank" class="menu-card card-spelling">
            <img src="spellinglogo.png" alt="Spellingoefenen">
            <div>Spellingoefenen</div>
        </a>

        <a href="https://www.taaloefenen.nl" target="_blank" class="menu-card card-taal">
            <img src="TO logo.png" alt="Taaloefenen">
            <div>Taaloefenen</div>
        </a>

        <a href="https://www.faqta.nl" target="_blank" class="menu-card card-faqta">
            <img src="Faqta logo.png" alt="Faqta">
            <div>Faqta</div>
        </a>

        <a href="topografie.html" class="menu-card card-topo">
            <img src="Topografie.png" alt="Topografie">
            <div>Topografie</div>
        </a>
    </div>

    <div class="modal-overlay" id="rekenModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>➕ Rekenmenu - Maak je keuze</span>
                <button class="close-btn" onclick="closeRekeningMenu()">✖ Sluiten</button>
            </div>
            <div class="modal-body">
                <a href="scoren.html" class="modal-btn">🎯 Scoren!</a>
                <a href="minecraft.html" class="modal-btn">⛏ Minecraft spel afronden</a>
            </div>
        </div>
    </div>

    <script>
        function openRekeningMenu() {
            document.getElementById('rekenModal').style.display = 'flex';
        }
        function closeRekeningMenu() {
            document.getElementById('rekenModal').style.display = 'none';
        }
    </script>

</body>
</html>
