<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBS De Eendragt - Dashboard</title>
    <style>
        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333333;
        }

        .main-header {
            background-color: #0d3c6c;
            color: #ffffff;
            padding: 15px 40px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .main-header h1 { margin: 0; font-size: 24px; font-weight: 600; }
        .main-header p { margin: 5px 0 0 0; font-size: 14px; opacity: 0.8; }

        .grid-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .menu-card {
            background: #ffffff;
            border: 3px solid;
            border-radius: 16px;
            padding: 25px 15px;
            text-align: center;
            text-decoration: none;
            color: #0d3c6c;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            transition: transform 0.15s, box-shadow 0.15s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 180px;
            box-sizing: border-box;
            cursor: pointer;
        }

        .menu-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
        }

        .menu-card img {
            max-height: 80px;
            max-width: 80%;
            object-fit: contain;
            margin-bottom: 15px;
        }

        /* Originele tegel-kleuren */
        .card-snappet { border-color: #ff7a00; }
        .card-rekenen { border-color: #00a3a3; }
        .card-automatiseringen { border-color: #333333; }
        .card-spelling { border-color: #4b5563; }
        .card-taal { border-color: #8b5cf6; }
        .card-faqta { border-color: #2563eb; }
        .card-topo { border-color: #059669; }
    </style>
</head>
<body>

    <div class="main-header">
        <h1>CBS De Eendragt</h1>
        <p>Lef • Liefde • Leren • Leuk</p>
    </div>

    <div class="grid-container">
        <a href="https://snappet.org" target="_blank" class="menu-card card-snappet">
            <img src="SNAPPET.jpeg" alt="Snappet">
            <div>Snappet</div>
        </a>

        <a href="minecraft.html" class="menu-card card-rekenen">
            <img src="Rekenen.jpeg" alt="Rekenen">
            <div>Rekenen</div>
        </a>

        <a href="tafels/" class="menu-card card-automatiseringen">
            <img src="Automatiseren.jpeg" alt="Automatiseren">
            <div>Automatiseren</div>
        </a>

        <a href="https://www.spellingoefenen.nl" target="_blank" class="menu-card card-spelling">
            <img src="spellinglogo.png" alt="Spellingoefenen">
            <div>Spellingoefenen</div>
        </a>

        <a href="https://www.taaloefenen.nl" target="_blank" class="menu-card card-taal">
            <img src="TO logo.png" alt="Taaloefenen">
            <div>Taaloefenen</div>
        </a>

        <a href="https://www.faqta.nl" target="_blank" class="menu-card card-faqta">
            <img src="Faqta logo.png" alt="Faqta">
            <div>Faqta</div>
        </a>

        <a href="topografie.html" class="menu-card card-topo">
            <img src="Topografie.png" alt="Topografie">
            <div>Topografie</div>
        </a>
    </div>

</body>
</html>
