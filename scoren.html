<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoren! - CBS De Eendragt</title>
    <style>
        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
        }

        .main-header {
            background-color: #0d3c6c;
            color: #ffffff;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            box-sizing: border-box;
        }

        .main-header h1 { margin: 0; font-size: 24px; font-weight: 600; }
        
        .back-btn {
            background-color: #00a3a3;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.15s;
        }
        .back-btn:hover { background-color: #008282; }

        .game-container {
            max-width: 900px;
            width: 95%;
            margin: 30px auto;
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
            box-sizing: border-box;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 25px;
            font-size: 20px;
            font-weight: bold;
            color: #0d3c6c;
            background: #e2e8f0;
            padding: 15px;
            border-radius: 8px;
        }

        .ball-zone {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 30px 0;
            height: 140px;
        }

        .ball-question {
            background: #ff7a00;
            color: white;
            font-size: 32px;
            font-weight: bold;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 15px rgba(255, 122, 0, 0.4);
            cursor: pointer;
            transition: transform 0.1s;
        }
        .ball-question:active {
            transform: scale(1.05);
        }

        .goals-container {
            display: flex;
            justify-content: space-between;
            gap: 30px;
            margin-top: 30px;
        }

        .goal {
            flex: 1;
            border: 4px dashed #00a3a3;
            background-color: #f8fafc;
            border-radius: 12px;
            padding: 40px 20px;
            font-size: 24px;
            font-weight: bold;
            color: #0d3c6c;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .goal:hover {
            background-color: #e6fffa;
            transform: scale(1.02);
        }

        .goal span {
            font-size: 16px;
            color: #64748b;
            font-weight: normal;
            margin-top: 8px;
        }

        .feedback {
            font-size: 24px;
            font-weight: bold;
            margin-top: 20px;
            height: 35px;
        }
        .correct { color: #10b981; }
        .wrong { color: #ef4444; }
    </style>
</head>
<body>

    <div class="main-header">
        <h1>🎯 Scoren! - Breuken, Procenten & Verhoudingen</h1>
        <a href="index.html" class="back-btn">⬅ Terug naar Home</a>
    </div>

    <div class="game-container">
        <div class="stats">
            <div>Score: <span id="score-display">0</span></div>
            <div>Opgave: <span id="round-display">1/10</span></div>
        </div>

        <p style="font-size: 18px; color: #4a5568; margin-bottom: 10px;">Klik op het juiste doel dat hoort bij de waarde van de bal!</p>

        <div class="ball-zone">
            <div class="ball-question" id="current-question">-</div>
        </div>

        <div class="goals-container">
            <div class="goal" onclick="checkAnswer('A')">
                <div id="goal-A-text">Doel A</div>
                <span id="goal-A-sub">Minder dan de helft (&lt; 50%)</span>
            </div>
            <div class="goal" onclick="checkAnswer('B')">
                <div id="goal-B-text">Doel B</div>
                <span id="goal-B-sub">De helft of meer (&ge; 50%)</span>
            </div>
        </div>

        <div class="feedback" id="feedback-text"></div>
    </div>

    <script>
        let score = 0;
        let currentRound = 1;
        const totalRounds = 10;
        let currentItem = {};

        const pool = [
            { question: "25%", target: "A", hint: "Kwart" },
            { question: "3/4", target: "B", hint: "Driekwart" },
            { question: "1 op de 5", target: "A", hint: "20%" },
            { question: "60%", target: "B", hint: "Meer dan de helft" },
            { question: "2 op de 3", target: "B", hint: "66%" },
            { question: "1/8", target: "A", hint: "12,5%" },
            { question: "50%", target: "B", hint: "Precies de helft" },
            { question: "40%", target: "A", hint: "Minder dan de helft" },
            { question: "4 op de 5", target: "B", hint: "80%" },
            { question: "7/10", target: "B", hint: "70%" },
            { question: "10%", target: "A", hint: "Een tiende" },
            { question: "1/3", target: "A", hint: "33%" }
        ];

        let gameQuestions = [];

        function startGame() {
            score = 0;
            currentRound = 1;
            gameQuestions = [...pool].sort(() => Math.random() - 0.5).slice(0, totalRounds);
            document.getElementById('score-display').innerText = score;
            nextQuestion();
        }

        function nextQuestion() {
            if (currentRound > totalRounds) {
                document.getElementById('current-question').style.display = "none";
                const feedbackEl = document.getElementById('feedback-text');
                feedbackEl.className = "correct";
                feedbackEl.innerHTML = `🏆 Top gescoord! Je eindscore is <strong>${score}</strong> punten.`;
                return;
            }

            document.getElementById('round-display').innerText = `${currentRound}/${totalRounds}`;
            document.getElementById('feedback-text').innerText = "";
            
            currentItem = gameQuestions[currentRound - 1];
            document.getElementById('current-question').innerText = currentItem.question;
        }

        function checkAnswer(chosenGoal) {
            if (currentRound > totalRounds) return;

            const feedbackEl = document.getElementById('feedback-text');
            if (chosenGoal === currentItem.target) {
                score += 10;
                feedbackEl.className = "correct";
                feedbackEl.innerText = "⚽ GOAL!! +10 punten";
                document.getElementById('score-display').innerText = score;
            } else {
                feedbackEl.className = "wrong";
                feedbackEl.innerText = `💥 MIS! Het antwoord was Doel ${currentItem.target} (${currentItem.hint})`;
            }

            currentRound++;
            setTimeout(nextQuestion, 1500);
        }

        window.onload = startGame;
    </script>
</body>
</html>
