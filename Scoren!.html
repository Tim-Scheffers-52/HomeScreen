<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scoren! - Interactieve breuken/procenten/verhoudingen game</title>
<style>
  * {
    box-sizing: border-box;
    user-select: none;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #061326;
    font-family: Arial, Helvetica, sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #game {
    position: relative;
    width: min(100vw, 177.777vh);
    height: min(56.25vw, 100vh);
    background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABgAAAAQACAIAAACoEwUVAABhWmNhQlgAAGFaanVtYgAAAB5qdW1kYzJwYQARABCAAACqADibcQNjMnBhAAAAYTRqdW1iAAAAR2p1bWRjMm1hABEAEIAAAKoAOJtxA3VybjpjMnBhOjlmMzcyNmEzLTZiYzEtNDM0My04NjMwLTNiOGI1ZDRlN2Q2MgAAABf9anVtYgAAAClqdW1kYzJhcwARABCAAACqADibcQNjMnBhLmFzc2VydGlvbnMAAAAJ0Wp1bWIAAAA7anVtZEDLDDK7ikidpwsq1vR/Q2kTYzJwYS5pY29uAAAAABhjMnNo4QX4YgJTaXXVsEWCXZU+HgAAABdiZmRiAGltYWdlL3N2Zyt4bWwAAAAJd2JpZGI8c3ZnIHdpZHRoPSI3MTYiIGhlaWdodD0iNzE2IiB2aWV3Qm94PSIwIDAgNzE2IDcxNiIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPHBhdGggZD0iTTUwOC43NDkgMzE3LjM5OUM1MTYuNzc3IDI4Ny4zMTQgNTA4Ljk5MSAyNTMuODg0IDQ4NS4zODkgMjMwLjI4MkM0NjEuNzg4IDIwNi42ODEgNDI4LjM2IDE5OC44OTUgMzk4LjI3MyAyMDKe9/");
    background-size: cover;
    background-position: center;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0,0,0,0.8);
  }

  .goalZone {
    position: absolute;
    width: 14.5%;
    height: 33%;
    border: 3px dashed rgba(255, 255, 255, 0.4);
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.05);
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  #zoneLeft { top: 35.5%; left: 1%; }
  #zoneRight { top: 35.5%; right: 1%; }

  #rack {
    position: absolute;
    bottom: 2%;
    left: 14%;
    width: 72%;
    height: 16%;
    background: rgba(255, 255, 255, 0.1);
    border: 2px solid rgba(255, 255, 255, 0.3);
    backdrop-filter: blur(8px);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 0 20px;
  }

  .ballSlot {
    width: 7%;
    height: 80%;
    border: 2px dashed rgba(255,255,255,0.2);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .ball {
    position: absolute;
    width: min(7vw, 12vh);
    height: min(7vw, 12vh);
    border-radius: 50%;
    cursor: grab;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: min(1.3vw, 2.2vh);
    color: #fff;
    text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    box-shadow: inset -8px -8px 16px rgba(0,0,0,0.5), 0 8px 16px rgba(0,0,0,0.4);
    transition: transform 0.1s;
    touch-action: none;
    z-index: 10;
  }
  .ball:active { cursor: grabbing; transform: scale(1.05); z-index: 100; }
  
  .ball.red { background: radial-gradient(circle at 30% 30%, #ff6b6b, #c91a1a); }
  .ball.yellow { background: radial-gradient(circle at 30% 30%, #ffd166, #d48c00); color: #222; text-shadow: none; }
  .ball.blue { background: radial-gradient(circle at 30% 30%, #4cc9f0, #0f7491); }

  .ball .sub {
    font-size: 0.65em;
    opacity: 0.85;
    margin-top: 2px;
  }

  .ball.locked {
    cursor: default;
    opacity: 0.5;
    transform: scale(0.9);
    box-shadow: none;
    pointer-events: none;
  }

  #scoreBoard {
    position: absolute;
    top: 3%;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(15, 23, 42, 0.85);
    border: 3px solid #ffd166;
    padding: 10px 30px;
    border-radius: 30px;
    color: #fff;
    font-size: min(2vw, 3.5vh);
    font-weight: bold;
    text-align: center;
    letter-spacing: 1px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  }

  #badge {
    position: absolute;
    top: 35%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: rgba(16, 185, 129, 0.95);
    border: 4px solid #fff;
    padding: 20px 50px;
    border-radius: 20px;
    color: white;
    font-size: min(4vw, 7vh);
    font-weight: 900;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    z-index: 2000;
    pointer-events: none;
  }
  #badge.show {
    animation: popIn 1.5s forwards ease-in-out;
  }

  @keyframes popIn {
    0% { transform: translate(-50%, -50%) scale(0) rotate(-10deg); opacity: 0; }
    30% { transform: translate(-50%, -50%) scale(1.2) rotate(5deg); opacity: 1; }
    40% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
    80% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
  }
</style>
</head>
<body>

<div id="game">
  <div id="scoreBoard">GOALS: <span id="score">0</span> / 10</div>

  <div id="zoneLeft" class="goalZone"></div>
  <div id="zoneRight" class="goalZone"></div>

  <div id="badge"><span id="badgeTitle">GOOOAL!</span></div>

  <div id="rack">
    <div class="ballSlot" data-index="0"></div>
    <div class="ballSlot" data-index="1"></div>
    <div class="ballSlot" data-index="2"></div>
    <div class="ballSlot" data-index="3"></div>
    <div class="ballSlot" data-index="4"></div>
    <div class="ballSlot" data-index="5"></div>
    <div class="ballSlot" data-index="6"></div>
    <div class="ballSlot" data-index="7"></div>
    <div class="ballSlot" data-index="8"></div>
    <div class="ballSlot" data-index="9"></div>
  </div>
</div>

<script>
const items = [
  { val: "0,5", r: "1/2", y: "50%", b: "1 : 2" },
  { val: "0,25", r: "1/4", y: "25%", b: "1 : 4" },
  { val: "0,75", r: "3/4", y: "75%", b: "3 : 4" },
  { val: "0,2", r: "1/5", y: "20%", b: "1 : 5" },
  { val: "0,4", r: "2/5", y: "40%", b: "2 : 5" },
  { val: "0,6", r: "3/5", y: "60%", b: "3 : 5" },
  { val: "0,8", r: "4/5", y: "80%", b: "4 : 5" },
  { val: "0,1", r: "1/10", y: "10%", b: "1 : 10" },
  { val: "0,3", r: "3/10", y: "30%", b: "3 : 10" },
  { val: "0,7", r: "7/10", y: "70%", b: "7 : 10" },
  { val: "0,9", r: "9/10", y: "90%", b: "9 : 10" },
  { val: "0,125", r: "1/8", y: "12,5%", b: "1 : 8" },
  { val: "0,375", r: "3/8", y: "37,5%", b: "3 : 8" },
  { val: "0,625", r: "5/8", y: "62,5%", b: "5 : 8" },
  { val: "0,875", r: "7/8", y: "87,5%", b: "7 : 8" },
  { val: "0,33", r: "1/3", y: "33,3%", b: "1 : 3" },
  { val: "0,66", r: "2/3", y: "66,7%", b: "2 : 3" },
  { val: "0,16", r: "1/6", y: "16,7%", b: "1 : 6" },
  { val: "0,83", r: "5/6", y: "83,3%", b: "5 : 6" }
];

const kinds = ["red", "yellow", "blue"];
let score = 0;
const solved = new Set();

const gameEl = document.getElementById("game");
const scoreEl = document.getElementById("score");
const badge = document.getElementById("badge");
const badgeTitle = document.getElementById("badgeTitle");
const slots = document.querySelectorAll(".ballSlot");

function createBall(slotEl) {
  const item = items[Math.floor(Math.random() * items.length)];
  const kind = kinds[Math.floor(Math.random() * kinds.length)];
  
  let label = "";
  let sub = "";
  if (kind === "red") { label = item.r; sub = "breuk"; }
  if (kind === "yellow") { label = item.y; sub = "procent"; }
  if (kind === "blue") { label = item.b; sub = "verhouding"; }

  const ball = document.createElement("div");
  ball.className = `ball ${kind}`;
  ball.dataset.value = item.val;
  ball.dataset.kind = kind;
  
  ball.innerHTML = `${label}<span class="sub">${sub}</span>`;

  const slotRect = slotEl.getBoundingClientRect();
  const gameRect = gameEl.getBoundingClientRect();
  
  ball.style.left = (slotRect.left - gameRect.left + slotRect.width/2 - minSize()/2) + "px";
  ball.style.top = (slotRect.top - gameRect.top + slotRect.height/2 - minSize()/2) + "px";

  gameEl.appendChild(ball);
  initDrag(ball, slotEl);
}

function minSize() {
  return Math.min(window.innerWidth * 0.07, window.innerHeight * 0.12);
}

function initDrag(ball, initialSlot) {
  let offsetX = 0, offsetY = 0;
  let currentSlot = initialSlot;

  ball.addEventListener("pointerdown", dragStart);

  function dragStart(e) {
    ball.setPointerCapture(e.pointerId);
    const rect = ball.getBoundingClientRect();
    offsetX = e.clientX - rect.left - rect.width / 2;
    offsetY = e.clientY - rect.top - rect.height / 2;
    
    ball.addEventListener("pointermove", dragMove);
    ball.addEventListener("pointerup", dragEnd);
  }

  function dragMove(e) {
    const gameRect = gameEl.getBoundingClientRect();
    let x = e.clientX - gameRect.left - offsetX - minSize()/2;
    let y = e.clientY - gameRect.top - offsetY - minSize()/2;

    x = Math.max(0, Math.min(x, gameRect.width - minSize()));
    y = Math.max(0, Math.min(y, gameRect.height - minSize()));

    ball.style.left = x + "px";
    ball.style.top = y + "px";
  }

  function dragEnd(e) {
    ball.removeEventListener("pointermove", dragMove);
    ball.removeEventListener("pointerup", dragEnd);

    const ballRect = ball.getBoundingClientRect();
    const cx = ballRect.left + ballRect.width / 2;
    const cy = ballRect.top + ballRect.height / 2;

    const leftZone = document.getElementById("zoneLeft").getBoundingClientRect();
    const rightZone = document.getElementById("zoneRight").getBoundingClientRect();

    if (
      (cx >= leftZone.left && cx <= leftZone.right && cy >= leftZone.top && cy <= leftZone.bottom) ||
      (cx >= rightZone.left && cx <= rightZone.right && cy >= rightZone.top && cy <= rightZone.bottom)
    ) {
      checkGoals();
      return;
    }

    let targetSlot = null;
    let minDist = Infinity;

    slots.forEach(slot => {
      const sRect = slot.getBoundingClientRect();
      const scx = sRect.left + sRect.width / 2;
      const scy = sRect.top + sRect.height / 2;
      const dist = Math.hypot(cx - scx, cy - scy);

      if (dist < minDist && dist < 100) {
        minDist = dist;
        targetSlot = slot;
      }
    });

    if (targetSlot && targetSlot !== currentSlot) {
      const existingBall = findBallInSlot(targetSlot);
      if (!existingBall) {
        snapToSlot(ball, targetSlot);
        currentSlot = targetSlot;
      } else {
        snapToSlot(ball, currentSlot);
      }
    } else {
      snapToSlot(ball, currentSlot);
    }
    checkGoals();
  }
}

function findBallInSlot(slotEl) {
  const sRect = slotEl.getBoundingClientRect();
  return [...document.querySelectorAll(".ball:not(.locked)")].find(b => {
    const br = b.getBoundingClientRect();
    const bcx = br.left + br.width / 2;
    const bcy = br.top + br.height / 2;
    return bcx >= sRect.left && bcx <= sRect.right && bcy >= sRect.top && bcy <= sRect.bottom;
  });
}

function snapToSlot(ball, slotEl) {
  const slotRect = slotEl.getBoundingClientRect();
  const gameRect = gameEl.getBoundingClientRect();
  ball.style.left = (slotRect.left - gameRect.left + slotRect.width/2 - minSize()/2) + "px";
  ball.style.top = (slotRect.top - gameRect.top + slotRect.height/2 - minSize()/2) + "px";
}

function ballsInZone(zoneEl) {
  const zr = zoneEl.getBoundingClientRect();

  return [...document.querySelectorAll(".ball:not(.locked)")].filter(b => {
    const r = b.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;

    return cx >= zr.left && cx <= zr.right && cy >= zr.top && cy <= zr.bottom;
  });
}

function checkGoals() {
  document.querySelectorAll(".goalZone").forEach(zone => {
    const balls = ballsInZone(zone);
    const grouped = {};

    balls.forEach(b => {
      grouped[b.dataset.value] ??= [];
      grouped[b.dataset.value].push(b);
    });

    Object.entries(grouped).forEach(([value, group]) => {
      const kinds = new Set(group.map(b => b.dataset.kind));

      if (
        !solved.has(value) &&
        group.length >= 3 &&
        kinds.has("red") &&
        kinds.has("yellow") &&
        kinds.has("blue")
      ) {
        solved.add(value);
        score++;
        scoreEl.textContent = score;

        group.slice(0, 3).forEach(b => {
          b.classList.add("locked");
          b.style.pointerEvents = "none";
        });

        showGoal(score === 10);
      }
    });
  });
}

function showGoal(done) {
  badgeTitle.textContent = done ? "🏆 KAMPIOEN!" : "GOOOAL!";
  badge.classList.remove("show");
  void badge.offsetWidth; // Trigger reflow
  badge.classList.add("show");

  setTimeout(() => {
    if (!done) {
      fillEmptySlots();
    }
  }, 1000);
}

function fillEmptySlots() {
  slots.forEach(slot => {
    if (!findBallInSlot(slot)) {
      createBall(slot);
    }
  });
}

// Start het spel
slots.forEach(slot => createBall(slot));

window.addEventListener("resize", () => {
  slots.forEach(slot => {
    const b = findBallInSlot(slot);
    if (b) snapToSlot(b, slot);
  });
});
</script>

</body>
</html>
